[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mcprack-sync-vscode"
version = "1.0.0"
description = "Keep VS Code Copilot MCP server config in sync with mcprack"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vítězslav Dvořák", email = "info@vitexsoftware.cz"}]
dependencies = ["mcprack-client>=1.0.0"]

[project.scripts]
mcprack-sync-vscode = "mcprack_sync_vscode.__main__:main"

[project.urls]
Homepage = "https://github.com/VitexSoftware/mcprack-sync-vscode"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcprack_sync_vscode*"]
